name: Build FCS APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-rider:
    name: Build Rider APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Rider APK
        working-directory: FCS-Rider
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: fcs-rider-apk
          path: FCS-Rider/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-staff:
    name: Build Staff APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Staff APK
        working-directory: FCS-Staff
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Staff APK
        uses: actions/upload-artifact@v4
        with:
          name: fcs-staff-apk
          path: FCS-Staff/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
